[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puzzle-maker"
version = "1.0.0"
description = "All-in-one printable & interactive puzzle suite — mazes, word searches, crosswords with vector PDF export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["puzzle", "maze", "wordsearch", "crossword", "pdf", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "reportlab>=4.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
puzzle-maker = "server:main"

[tool.setuptools]
packages = ["api", "crossword", "maze", "pdf", "wordsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # pytest 9 deprecates class-scoped fixtures bound to instance methods
    "ignore::pytest.PytestRemovedIn10Warning",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
